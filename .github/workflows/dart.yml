# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "master" ]
    # Pushing a version tag (e.g. v1.0.0) builds the signed APK and publishes
    # it as a GitHub Release.
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  # Manual run (Actions tab -> Dart -> Run workflow). With "release" ticked on
  # master, it tags v<pubspec version> and publishes the GitHub Release.
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag v<pubspec version> on master)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      # Use the latest stable Flutter SDK, which includes Dart.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Uncomment this step to verify the use of 'dart format' on each commit.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze

      # Runs only once the project has tests in test/; `flutter test` fails
      # when that directory does not exist.
      - name: Run tests
        if: hashFiles('test/**') != ''
        run: flutter test

  # Builds a release APK for every push to master (or a manual run) and
  # attaches it to the workflow run as a downloadable artifact. For a version
  # tag (v*) or a manual run with "release" ticked, it also publishes a GitHub
  # Release with the APK.
  apk:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # create the release tag and GitHub Release

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Decides whether this run publishes a release, and for which version:
      # - a pushed tag v1.2.3 must match pubspec.yaml version 1.2.3+N
      # - a manual run with "release" ticked must be on master, and the tag
      #   v<pubspec version> must not exist yet
      - name: Determine release
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          release=false
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pubspec.yaml version $version."
              exit 1
            fi
            release=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$RELEASE_INPUT" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "::error::Releases can only be made from master (this run is on $GITHUB_REF_NAME)."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::Tag v$version already exists. Raise the version in pubspec.yaml first."
              exit 1
            fi
            release=true
          fi
          echo "Release: $release (version $version)"
          {
            echo "IS_RELEASE=$release"
            echo "VERSION=$version"
            echo "TAG=v$version"
          } >> "$GITHUB_ENV"

      # Optional: sign with the release key when these repository secrets are
      # set. Without them the APK is signed with the debug key.
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Signing secrets not set; a release must be signed with the release key."
              exit 1
            fi
            echo "::warning::Signing secrets not set; the APK will be signed with the debug key."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          # Write the values with Java-properties escaping (backslashes, leading
          # whitespace, non-ASCII), since build.gradle reads them via Properties.load.
          python3 - <<'PY'
          import os

          def escape(value):
              out = []
              for i, ch in enumerate(value):
                  if ch == "\\":
                      out.append("\\\\")
                  elif ch == " " and i == 0:
                      out.append("\\ ")
                  elif ch in "\t\n\r\f":
                      out.append({"\t": "\\t", "\n": "\\n", "\r": "\\r", "\f": "\\f"}[ch])
                  elif ord(ch) < 0x20 or ord(ch) > 0x7E:
                      data = ch.encode("utf-16-be")
                      for j in range(0, len(data), 2):
                          out.append("\\u%04x" % int.from_bytes(data[j:j + 2], "big"))
                  else:
                      out.append(ch)
              return "".join(out)

          values = {
              "storeFile": os.path.join(os.environ["RUNNER_TEMP"], "release.jks"),
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          with open("android/key.properties", "w", encoding="ascii") as f:
              for key, value in values.items():
                  f.write(f"{key}={escape(value)}\n")
          PY

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: timecopfork-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # Release notes are the version's section of CHANGELOG.md, up to the
      # next "## [" heading or the "---" separator.
      - name: Prepare release
        if: env.IS_RELEASE == 'true'
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "timecopfork-${VERSION}.apk"
          python3 - <<'PY'
          import os, re, sys
          version = os.environ["VERSION"]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          start = next((i for i, l in enumerate(lines)
                        if re.match(rf"## \[{re.escape(version)}\]", l)), None)
          if start is None:
              sys.exit(f"::error::CHANGELOG.md has no section for {version}")
          notes = []
          for line in lines[start + 1:]:
              if line.startswith("## [") or line.strip() == "---":
                  break
              notes.append(line)
          open("release-notes.md", "w", encoding="utf-8").write("\n".join(notes).strip() + "\n")
          PY
          cat release-notes.md

      # For a manual release this also creates the tag, on the commit that was
      # built. (Tags created with the workflow's token don't start another run.)
      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Time Cop Fork ${{ env.VERSION }}
          body_path: release-notes.md
          files: timecopfork-${{ env.VERSION }}.apk
          fail_on_unmatched_files: true
