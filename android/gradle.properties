org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false

# `flutter build apk --split-per-abi` (used by CI) normally adds 1000, 2000 or
# 4000 to the version code of each processor type's APK, as Google Play needs
# for several APKs of one release. The fork isn't on Google Play, and keeping
# the version code from pubspec.yaml (the number after "+") for every APK
# keeps it matching the release and the store metadata's changelogs.
force-version-code-ignoring-abi=true
